<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dia Claro | Seu dia, no ritmo certo</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #25352e;
      background: #f7f8f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --green: #285d4d;
      --muted: #758078;
      --line: #e8ebe5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .layout { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
    aside {
      display: flex; flex-direction: column; gap: 34px; padding: 28px 18px;
      border-right: 1px solid var(--line); background: #fff;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; }
    .brand-mark {
      display: grid; width: 38px; height: 38px; place-items: center;
      border-radius: 13px; background: #e8f0e9; color: var(--green); font-size: 20px;
    }
    .brand-name { font-size: 18px; font-weight: 750; letter-spacing: -.04em; }
    .nav-label { margin: 0 10px 10px; color: #9aa29c; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav button {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px;
      border: 0; border-radius: 11px; background: transparent; color: #69766e;
      text-align: left; font-size: 14px;
    }
    .nav button.active { background: #edf3ed; color: var(--green); font-weight: 650; }
    .nav .icon { width: 19px; text-align: center; font-size: 16px; }
    .nav .count { margin-left: auto; font-size: 12px; color: #8d9890; }
    .sidebar-bottom { margin-top: auto; padding: 17px; border-radius: 15px; background: #f5f7f3; }
    .sidebar-bottom strong { font-size: 13px; }
    .sidebar-bottom p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    main { width: min(100%, 1160px); padding: 32px clamp(20px, 5vw, 62px) 50px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 45px; }
    .date { color: var(--muted); font-size: 13px; }
    .avatar { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; background: #e8d8c9; color: #674e3e; font-weight: 700; }
    .greeting { margin-bottom: 30px; }
    .greeting p { margin: 0 0 7px; color: var(--muted); font-size: 14px; }
    h1 { margin: 0; color: #24352e; font-size: clamp(30px, 4vw, 42px); letter-spacing: -.055em; }
    h1 span { color: #809b76; }
    .overview { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(230px, .8fr); gap: 18px; margin-bottom: 30px; }
    .card { border: 1px solid var(--line); border-radius: 18px; background: #fff; }
    .focus-card { display: flex; min-height: 156px; align-items: center; justify-content: space-between; gap: 18px; padding: 24px 27px; overflow: hidden; }
    .focus-card .caption { margin: 0 0 10px; color: #849087; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .focus-card h2 { margin: 0; font-size: 20px; letter-spacing: -.035em; }
    .focus-card p:last-child { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .progress-ring {
      display: grid; width: 94px; height: 94px; flex: 0 0 auto; place-items: center;
      border-radius: 50%; background: conic-gradient(#56826c 0deg 216deg, #e9eee8 216deg 360deg);
      position: relative;
    }
    .progress-ring::before { position: absolute; width: 76px; height: 76px; border-radius: 50%; background: white; content: ""; }
    .progress-value { z-index: 1; color: var(--green); font-size: 18px; font-weight: 750; }
    .stat-card { display: flex; align-items: center; gap: 14px; padding: 22px; }
    .stat-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: #f3eee2; font-size: 19px; }
    .stat-card small { color: var(--muted); font-size: 12px; }
    .stat-card strong { display: block; margin-top: 3px; font-size: 25px; letter-spacing: -.04em; }
    .tasks-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 0 0 16px; }
    .tasks-heading h2 { margin: 0; font-size: 21px; letter-spacing: -.04em; }
    .tasks-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .today-label { padding: 7px 10px; border-radius: 9px; background: #edf3ed; color: var(--green); font-size: 12px; font-weight: 650; }
    .task-panel { padding: 16px; }
    .add-form { display: flex; gap: 9px; margin-bottom: 13px; }
    .add-form input {
      min-width: 0; flex: 1; padding: 12px 14px; border: 1px solid #e5e9e3;
      border-radius: 11px; outline: none; background: #fbfcfa; color: inherit; font-size: 14px;
    }
    .add-form input:focus { border-color: #81a08b; box-shadow: 0 0 0 3px #e9f1e9; }
    .add-form button { padding: 0 16px; border: 0; border-radius: 11px; background: var(--green); color: white; font-size: 13px; font-weight: 650; }
    .task-list { display: grid; gap: 7px; padding: 0; margin: 0; list-style: none; }
    .task-row { display: flex; align-items: center; gap: 12px; min-height: 57px; padding: 10px 12px; border: 1px solid #f0f1ee; border-radius: 12px; }
    .task-row input { width: 17px; height: 17px; accent-color: var(--green); }
    .task-title { flex: 1; font-size: 13px; }
    .task-row.done .task-title { color: #9ba29c; text-decoration: line-through; }
    .tag { padding: 5px 8px; border-radius: 7px; background: #f2f4f0; color: #778279; font-size: 10px; }
    .tag.urgent { background: #f9efeb; color: #a86750; }
    .remove { border: 0; background: none; color: #9a756b; font-size: 12px; }
    .empty { padding: 30px 10px; color: var(--muted); text-align: center; font-size: 14px; }
    .toast { position: fixed; right: 22px; bottom: 22px; padding: 12px 16px; border-radius: 12px; background: #253b31; color: white; font-size: 13px; opacity: 0; transform: translateY(8px); transition: .2s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      aside { display: none; }
      main { padding-top: 22px; }
      .topbar { margin-bottom: 34px; }
    }
    @media (max-width: 560px) {
      .overview { grid-template-columns: 1fr; }
      .focus-card { padding: 19px; }
      .task-panel { padding: 11px; }
      .tag { display: none; }
      .add-form button { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside aria-label="Navegação principal">
      <div class="brand"><div class="brand-mark" aria-hidden="true">✳</div><div class="brand-name">dia claro</div></div>
      <section>
        <p class="nav-label">Menu</p>
        <nav class="nav">
          <button class="active" type="button"><span class="icon">▦</span>Meu dia <span id="nav-count" class="count"></span></button>
          <button type="button" data-demo="Planejamento"><span class="icon">▤</span>Planejamento</button>
          <button type="button" data-demo="Importantes"><span class="icon">☆</span>Importantes</button>
        </nav>
      </section>
      <section>
        <p class="nav-label">Espaços</p>
        <nav class="nav">
          <button type="button" data-demo="Pessoal"><span class="icon">◉</span>Pessoal</button>
          <button type="button" data-demo="Trabalho"><span class="icon">◇</span>Trabalho</button>
        </nav>
      </section>
      <div class="sidebar-bottom">
        <strong>Um passo de cada vez</strong>
        <p>Escolha uma tarefa e dê atenção total a ela.</p>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="date" id="today-date"></div>
        <div class="avatar" aria-label="Perfil de Ana">A</div>
      </header>
      <section class="greeting">
        <p>Bom dia, Ana ☀</p>
        <h1>Seu dia, no <span>ritmo certo.</span></h1>
      </section>
      <section class="overview" aria-label="Resumo do dia">
        <article class="card focus-card">
          <div>
            <p class="caption">Seu progresso</p>
            <h2>Um bom começo.</h2>
            <p><span id="progress-summary">3 de 5 tarefas</span> concluídas hoje</p>
          </div>
          <div class="progress-ring" id="progress-ring" role="img" aria-label="60% concluído">
            <span class="progress-value" id="progress-value">60%</span>
          </div>
        </article>
        <article class="card stat-card">
          <div class="stat-icon" aria-hidden="true">✦</div>
          <div><small>Foco desta semana</small><strong>4 dias</strong></div>
        </article>
      </section>
      <section aria-labelledby="tasks-title">
        <div class="tasks-heading">
          <div><h2 id="tasks-title">Minhas tarefas</h2><p>Pequenos avanços contam.</p></div>
          <span class="today-label">Hoje</span>
        </div>
        <div class="card task-panel">
          <form class="add-form" id="add-form">
            <input id="task-input" maxlength="120" placeholder="Adicione uma tarefa ao seu dia..." aria-label="Nova tarefa">
            <button type="submit">+ Adicionar</button>
          </form>
          <ul class="task-list" id="task-list"></ul>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const initialTasks = [
      { id: "1", title: "Revisar prioridades da semana", label: "Pessoal", done: true },
      { id: "2", title: "Enviar proposta para a equipe", label: "Trabalho", done: true },
      { id: "3", title: "Fazer uma pausa para o café", label: "Bem-estar", done: true },
      { id: "4", title: "Preparar pauta da reunião", label: "Trabalho", done: false, urgent: true },
      { id: "5", title: "Caminhar por 20 minutos", label: "Bem-estar", done: false }
    ];
    let tasks = initialTasks;
    const list = document.querySelector("#task-list");
    const toast = document.querySelector("#toast");
    const input = document.querySelector("#task-input");
    let toastTimer;

    document.querySelector("#today-date").textContent =
      new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long" })
        .format(new Date()).replace(/^./, letter => letter.toUpperCase());

    function render() {
      list.replaceChildren();
      const done = tasks.filter(task => task.done).length;
      const total = tasks.length;
      const percent = total ? Math.round(done / total * 100) : 0;
      document.querySelector("#progress-summary").textContent = `${done} de ${total} tarefas`;
      document.querySelector("#progress-value").textContent = `${percent}%`;
      document.querySelector("#progress-ring").style.background =
        `conic-gradient(#56826c 0deg ${percent * 3.6}deg, #e9eee8 ${percent * 3.6}deg 360deg)`;
      document.querySelector("#progress-ring").setAttribute("aria-label", `${percent}% concluído`);
      document.querySelector("#nav-count").textContent = String(total - done);

      if (!total) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "Tudo pronto por hoje. Aproveite seu tempo!";
        list.append(empty);
        return;
      }

      tasks.forEach(task => {
        const row = document.createElement("li");
        row.className = `task-row${task.done ? " done" : ""}`;
        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = task.done;
        check.setAttribute("aria-label", `Concluir ${task.title}`);
        check.addEventListener("change", () => {
          task.done = check.checked;
          render();
        });
        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = task.title;
        const tag = document.createElement("span");
        tag.className = `tag${task.urgent ? " urgent" : ""}`;
        tag.textContent = task.urgent ? "Prioridade" : task.label;
        const remove = document.createElement("button");
        remove.className = "remove";
        remove.type = "button";
        remove.textContent = "Remover";
        remove.setAttribute("aria-label", `Remover ${task.title}`);
        remove.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          render();
          showToast("Tarefa removida");
        });
        row.append(check, title, tag, remove);
        list.append(row);
      });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    document.querySelector("#add-form").addEventListener("submit", event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) {
        input.focus();
        showToast("Digite uma tarefa para adicionar");
        return;
      }
      tasks.push({ id: crypto.randomUUID(), title, label: "Pessoal", done: false });
      input.value = "";
      render();
      input.focus();
      showToast("Tarefa adicionada ao seu dia");
    });

    document.querySelectorAll("[data-demo]").forEach(button => {
      button.addEventListener("click", () => showToast(`${button.dataset.demo}: demonstração visual`));
    });

    render();
  </script>
</body>
</html>
